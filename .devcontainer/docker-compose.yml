services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.11
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    depends_on:
      - db

  db:
    image: mariadb:10.11
    restart: unless-stopped
    command: --local-infile=1
    environment:
      MARIADB_ROOT_PASSWORD: praktikum
      MARIADB_ROOT_HOST: '%'
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
